name: Deploy verified browser release

on:
  push:
    branches: [main]
    paths: [.github/workflows/deploy-pages.yml]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: github-pages
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Download the audited production release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          gh release download browser-1.6.15-2026-10-08 --pattern stardew-browser-1.6.15.tar.gz
          echo '65e59d8c27b4dcf7cabfb99ff581391204a96212cf6700a8f079be9103a10b01  stardew-browser-1.6.15.tar.gz' | sha256sum --check --strict
          mkdir dist
          tar --extract --gzip --file stardew-browser-1.6.15.tar.gz --directory dist --no-same-owner --no-same-permissions
      - name: Verify static package boundaries
        run: |
          python3 - <<'PY'
          from pathlib import Path
          root = Path('dist')
          assert all(not p.is_symlink() for p in root.rglob('*'))
          files = [p for p in root.rglob('*') if p.is_file()]
          assert len(files) == 4279
          assert sum(p.stat().st_size for p in files) == 991794654
          assert (root / 'index.html').is_file()
          assert (root / '_framework/blazor.webassembly.js').is_file()
          assert not (root / 'platform/scenarios.js').exists()
          assert 'testing.failNextCommit' not in (root / 'platform/storage.js').read_text()
          print('Verified audited production package: 4279 files, 991794654 bytes')
          PY
      - name: Configure Pages
        uses: actions/configure-pages@983d7736d9b0ae728b81ab479565c72886d7745b # v5
      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@7b1f4a764d45c48632c6b24a0339c27f5614fb0b # v4
        with:
          path: dist
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@d6db90164ac5ed86f2b6aed7e0febac5b3c0c03e # v4
